<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style"> 
</head>
<body>
  <form>
    <h1 style="color:rgb(181, 6, 239)" id="currentTime"> </h1>
    Name: <input type="text" name="name" placeholder="Enter Your Name" ><br><br>
    Email: <input type="email" name="email" placeholder="Enter Your Email" ><br><br>
    Password:
    <input type="password" name="password" placeholder="Enter your Email"><br><br>
    Contact: <input type="text" name="name" placeholder="Enter Your Phone Number"><br><br>
    Gender: <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female <br><br>
    Course:
    <select name="course">
    <option>B.Tech</option>
    <option>MCA</option>
    <option>BCA</option>
    </select><br><br>
    Address:<br>
    <textarea name="address" placeholder="Enter Your Current Address"></textarea><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">
  </form>
  <script src="script.js"></script>
</body>
</html>
